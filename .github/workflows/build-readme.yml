name: Build README

on:
  schedule:
    - cron: '1 12 * * 0,3,5'

  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Checkout repository
      - name: Checkout repo
        uses: actions/checkout@v4

      # Setup Node.js
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Update README
      - name: Update README
        run: |
          node updateReadme.js
          cat README.md

      # Commit changes
      - name: Commit and push if changed
        run: |
          git diff

          git config --global user.email "dylanjfisher2005@gmail.com"
          git config --global user.name "DylanJFisher"

          git add README.md

          git diff --cached --quiet && exit 0

          git commit -m "Updated README"
          git push